metadata:
    format: Lava-Test Test Definition 1.0
    name: memtest
    description: "Check the kernel's early memory test (CONFIG_MEMTEST,
      memtest=N on the kernel command line), which writes and verifies N
      patterns over all free memory before the other CPUs start. Parses the
      early_memtest lines of the kernel log: memtest-patterns passes when
      the expected number of patterns ran, memtest-bad-memory when no bad
      memory was reported. Both are skipped when memtest= is not set or the
      kernel lacks CONFIG_MEMTEST. Run it right after boot, before the
      kernel log fills up."
    maintainer:
        - tyler.baker@oss.qualcomm.com
    os:
        - debian
        - ubuntu
        - fedora
        - openembedded
        - buildroot
    scope:
        - functional
    devices:
        - monaco-arduino-monza
        - qrb2210-arduino-imola
        - qcs6490-rb3gen2
        - qcs615-ride
        - lemans-evk

params:
    # Number of patterns the kernel must have run; empty takes it from
    # memtest= on the kernel command line.
    PATTERNS: ""

run:
    steps:
        - cd ./automated/linux/memtest/
        - ./memtest.sh -n "${PATTERNS}"
        - ../../utils/send-to-lava.sh ./output/result.txt
