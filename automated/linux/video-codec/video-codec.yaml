metadata:
    format: Lava-Test Test Definition 1.0
    name: video-codec
    description: "V4L2 stateful video codec check through FFmpeg's v4l2m2m
      wrappers: hardware decodes of reference streams must match the software
      decode frame by frame (MD5), a hardware encode must decode to the right
      frame count and quality. With the platform device and driver given,
      decodes after runtime suspend and after a driver rebind, and the
      negative case: without its firmware file the driver must not probe,
      or must not decode if it loads the firmware on the first open.
      Without a codec video node or FFmpeg the test is skipped."
    maintainer:
        - tyler.baker@oss.qualcomm.com
    os:
        - debian
        - ubuntu
        - fedora
        - openembedded
        - buildroot
    scope:
        - functional
    devices:
        - monaco-arduino-monza
        - qrb2210-arduino-imola
        - qcs6490-rb3gen2
        - lemans-evk

params:
    # Codec platform device and its driver, e.g. 5a00000.video-codec and
    # qcom-venus; empty skips the runtime PM, rebind and firmware cases, and
    # any video node (a camera too) counts as the codec's.
    DEVICE: ""
    DRIVER: ""
    # FFmpeg codec names with a <codec>_v4l2m2m wrapper.
    DECODERS: "h264 hevc vp9"
    ENCODERS: "h264"
    # Reference streams <codec>-*.<ext> with <stream>.md5 next to each: the
    # MD5 of every frame of a software decode to NV12, one per line, e.g.
    # ffmpeg -i <stream> -fps_mode passthrough -pix_fmt nv12 -f framemd5 - |
    #     grep -v '^#' | awk -F, '{gsub(/ /, "", $6); print $6}'
    STREAMS: "/usr/share/video-codec"
    # Firmware file hidden for the negative case; empty skips it.
    FIRMWARE: ""
    MIN_PSNR: "30"
    # Encoded frame size; a size the codec does not pad (see the script).
    ENCODE_SIZE: "1280x736"

run:
    steps:
        - cd ./automated/linux/video-codec/
        - ./video-codec.sh -d "${DEVICE}" -r "${DRIVER}" -D "${DECODERS}" -E "${ENCODERS}" -s "${STREAMS}" -f "${FIRMWARE}" -p "${MIN_PSNR}" -S "${ENCODE_SIZE}"
        - ../../utils/send-to-lava.sh ./output/result.txt
